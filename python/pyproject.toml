[project]
name = "python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pip>=26.2.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "nexwick",
    "mappy>=2.31",
    "tqdm>=4.70.1",
    "adjusttext>=1.4.0",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
nexwick = { git = "https://github.com/tochsner/nexwick.git", rev = "7716e68a2d7a0977974fbef2f9074abeb0585bd4", subdirectory = "nexwick-py" }
